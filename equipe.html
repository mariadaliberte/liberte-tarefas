<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liberte Equipe</title>
  <meta name="description" content="Suas tarefas na Liberte: veja, conclua e comente.">
  <meta name="theme-color" content="#5b2a4e">
  <link rel="icon" href="icons/favicon-64-v2.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-v2.png">
  <style>
    :root {
      --brand: #5b2a4e; --brand-soft: #f3e9f0; --bg: #f7f5f3; --surface: #fff; --text: #1f1a1d;
      --muted: #6f6670; --line: #e7e1e4; --urgente: #d93838; --alta: #e08a1e; --ok: #2f9e5b;
      --late-bg: #fde8e8; --on-brand: #fff; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --brand: #d79ac6; --brand-soft: #3a2433; --bg: #141113; --surface: #1e1a1d; --text: #f1ecef;
        --muted: #a59ca3; --line: #2f292d; --late-bg: #4a1f1f; --on-brand: #1e1a1d; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --brand: #d79ac6; --brand-soft: #3a2433; --bg: #141113; --surface: #1e1a1d; --text: #f1ecef;
      --muted: #a59ca3; --line: #2f292d; --late-bg: #4a1f1f; --on-brand: #1e1a1d; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--brand); color: var(--on-brand); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
    header img { width: 36px; height: 36px; border-radius: 10px; }
    header h1 { font-size: 18px; margin: 0; flex: 1; }
    header button { background: transparent; color: inherit; border: 1px solid currentColor; border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 22px 0 8px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
    .card.done .title { text-decoration: line-through; color: var(--muted); }
    .top { display: flex; gap: 10px; align-items: flex-start; }
    .title { font-weight: 600; flex: 1; overflow-wrap: anywhere; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .chip { font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
    .chip.late { background: var(--late-bg); color: var(--urgente); border-color: transparent; }
    .chip.urgente { color: var(--urgente); font-weight: 600; }
    .chip.alta { color: var(--alta); font-weight: 600; }
    .notes { white-space: pre-line; color: var(--muted); font-size: 14px; margin-top: 8px; }
    .checklist { list-style: none; padding: 0; margin: 8px 0 0; }
    .checklist label { display: flex; gap: 8px; align-items: center; padding: 3px 0; }
    .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .row input { flex: 1; min-width: 160px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit; }
    .btn { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 10px; padding: 9px 14px; font: inherit; font-weight: 500; cursor: pointer; }
    .btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
    .btn:disabled { opacity: .6; }
    .center { text-align: center; padding: 48px 8px; }
    .center p { color: var(--muted); }
    .error { color: var(--urgente); }
    #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: calc(100% - 32px); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-192-v2.png" alt="">
    <h1>Liberte · Minhas tarefas</h1>
    <button type="button" id="logout" hidden>Sair</button>
  </header>
  <main id="main">
    <div class="center"><p>Carregando…</p></div>
  </main>
  <div id="toast" hidden></div>
  <script type="module" src="js/team.js"></script>
</body>
</html>
